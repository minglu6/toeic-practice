<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Presentation in a meeting room">
  <rect width="640" height="420" fill="#e8eef5"/>
  <rect x="40" y="40" width="560" height="300" fill="#d9e2ec" stroke="#6b7c8f" stroke-width="2"/>
  <!-- screen -->
  <rect x="80" y="70" width="220" height="140" fill="#f5f7fa" stroke="#334e68" stroke-width="3"/>
  <rect x="100" y="95" width="80" height="10" fill="#486581"/>
  <rect x="100" y="115" width="160" height="8" fill="#9fb3c8"/>
  <rect x="100" y="135" width="140" height="8" fill="#9fb3c8"/>
  <rect x="100" y="155" width="120" height="8" fill="#9fb3c8"/>
  <!-- presenter -->
  <circle cx="360" cy="150" r="22" fill="#f0c7a0"/>
  <rect x="340" y="172" width="40" height="70" rx="6" fill="#243b53"/>
  <rect x="330" y="185" width="14" height="45" fill="#243b53"/>
  <rect x="376" y="185" width="14" height="40" fill="#243b53"/>
  <!-- audience -->
  <g fill="#486581">
    <circle cx="280" cy="280" r="16"/><rect x="265" y="296" width="30" height="40" rx="4"/>
    <circle cx="360" cy="290" r="16"/><rect x="345" y="306" width="30" height="36" rx="4"/>
    <circle cx="440" cy="282" r="16"/><rect x="425" y="298" width="30" height="40" rx="4"/>
  </g>
  <!-- table -->
  <rect x="240" y="330" width="240" height="16" fill="#8b7355"/>
  <text x="320" y="400" text-anchor="middle" font-family="Arial" font-size="14" fill="#334e68">Meeting room presentation</text>
</svg>
