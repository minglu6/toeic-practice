  <rect x="0" y="360" width="640" height="60" fill="#cbb89a"/>
  <!-- wall map -->
  <rect x="160" y="60" width="320" height="220" fill="#dcefe8" stroke="#2f5d50" stroke-width="3"/>
  <path d="M190 100 H450 M190 140 H450 M190 180 H450 M190 220 H450" stroke="#7aa899" stroke-width="2"/>
  <path d="M220 80 V260 M280 80 V260 M340 80 V260 M400 80 V260" stroke="#7aa899" stroke-width="2"/>
  <circle cx="310" cy="160" r="10" fill="#c0392b"/>
  <!-- woman -->
  <circle cx="480" cy="230" r="24" fill="#f0c7a0"/>
  <rect x="455" y="254" width="50" height="90" rx="8" fill="#5c6ac4"/>
  <rect x="500" y="270" width="40" height="12" rx="4" fill="#f0c7a0"/>
