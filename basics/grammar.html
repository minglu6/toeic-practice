<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>语法 · 托业考试练习</title>
<link rel="stylesheet" href="../css/exam.css" />
</head>
<body class="exam">
<div class="sheet">
  <div class="header">
    <div class="part">Basics · Grammar</div>
    <div class="meta">Part 5 风格速练</div>
  </div>
  <div id="qs"></div>
  <div class="actions">
    <button type="button" class="btn primary" id="check">核对答案</button>
    <button type="button" class="btn" id="reset">重做</button>
  </div>
  <p class="score" id="score"></p>
  <div class="explain" id="explain"></div>
</div>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/quiz.js"></script>
<script>
(function () {
  var BASE = (window.TOEIC && TOEIC.BASE) || '../';
  var picks = {}, data, qsEl = document.getElementById('qs');
  fetch(BASE + 'data/grammar.json').then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    qsEl.innerHTML = d.sets[0].questions.map(function (qq) {
      return '<div class="q" data-q="' + qq.q + '" data-ans="' + qq.answer + '">' +
        '<div class="stem">' + qq.q + '. ' + ToeicQuiz.escapeHtml(qq.stem) + '</div>' +
        ToeicQuiz.renderOptions(qq.choices) + '</div>';
    }).join('');
    ToeicQuiz.bindOptions(qsEl, picks);
  });
  document.getElementById('check').onclick = function () {
    var r = ToeicQuiz.grade(qsEl, picks, 'grammar');
    document.getElementById('score').textContent = '得分：' + r.right + ' / ' + r.total;
    var html = '<h2>答案与解析</h2>';
    data.sets[0].questions.forEach(function (qq) {
      html += '<div class="item"><div class="ans">' + qq.q + ' · ' + qq.answer + '</div>';
      html += '<div class="qzh">' + ToeicQuiz.escapeHtml(qq.zh_stem) + '</div><div class="opts-zh">';
      Object.keys(qq.zh_opts).forEach(function (k) {
        html += '(' + k + ') ' + ToeicQuiz.escapeHtml(qq.zh_opts[k]) + '<br>';
      });
      html += '</div><p>' + ToeicQuiz.escapeHtml(qq.rationale) + '</p></div>';
    });
    var box = document.getElementById('explain');
    box.innerHTML = html; box.className = 'explain show';
    ToeicStore.setProgress('grammar', r);
  };
  document.getElementById('reset').onclick = function () {
    ToeicQuiz.reset(qsEl, picks);
    document.getElementById('score').textContent = '';
    document.getElementById('explain').className = 'explain';
  };
})();
</script>
</body>
</html>
