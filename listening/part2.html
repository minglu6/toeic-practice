<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Part 2 · 托业考试练习</title>
<link rel="stylesheet" href="../css/exam.css" />
</head>
<body class="exam">
<div class="sheet">
  <div class="header">
    <div class="part">Listening · Part 2</div>
    <div class="meta">Question–Response · 先听再选，核对后显示原文</div>
  </div>
  <p class="set-nav" id="setNav"></p>
  <div class="audio-bar"><div>播放音频</div><audio id="audio" controls preload="metadata"></audio></div>
  <div id="qs"></div>
  <div class="actions">
    <button type="button" class="btn primary" id="check">核对答案</button>
    <button type="button" class="btn" id="prev">上一题</button>
    <button type="button" class="btn" id="next">下一题</button>
  </div>
  <p class="score" id="score"></p>
  <div class="explain" id="explain"></div>
</div>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/listening.js"></script>
<script>
(function () {
  var data, idx = 0, picks = {};
  var qs = document.getElementById('qs');
  function render() {
    picks = {};
    var set = data.sets[idx];
    document.getElementById('setNav').textContent = '第 ' + (idx + 1) + ' / ' + data.sets.length + ' 题';
    document.getElementById('audio').src = ToeicListening.abs(set.audio);
    qs.innerHTML = '<div class="q" data-q="' + set.id + '" data-ans="' + set.answer + '">' +
      '<div class="stem">选择最恰当的回应（听音频；题干不显示）</div>' +
      ToeicQuiz.renderOptions(set.choices) + '</div>';
    document.getElementById('score').textContent = '';
    document.getElementById('explain').className = 'explain';
    document.getElementById('explain').innerHTML = '';
    ToeicQuiz.bindOptions(qs, picks);
  }
  ToeicListening.load('part2').then(function (d) { data = d; render(); });
  document.getElementById('check').onclick = function () {
    var r = ToeicQuiz.grade(qs, picks, 'part2');
    document.getElementById('score').textContent = '得分：' + r.right + ' / ' + r.total;
    var box = document.getElementById('explain');
    box.innerHTML = ToeicListening.explainListening(data.sets[idx], 'part2');
    box.className = 'explain show';
    ToeicStore.setProgress('part2', { set: data.sets[idx].id, right: r.right });
  };
  document.getElementById('prev').onclick = function () { if (idx > 0) { idx--; render(); } };
  document.getElementById('next').onclick = function () { if (idx < data.sets.length - 1) { idx++; render(); } };
})();
</script>
</body>
</html>
